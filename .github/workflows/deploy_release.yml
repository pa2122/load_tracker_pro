name: Automated Build & Release Pipeline

on:
  push:
    branches:
      - master
      - v2-redesign

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Test Suite (14 Tests)
        run: ./gradlew testDebugUnitTest

      - name: Build Signed Release App Bundle (v1 & v2)
        run: |
          ./gradlew bundleV1Release
          ./gradlew bundleV2Release

      - name: Upload v1.x Release App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-v1-release-aab
          path: app/build/outputs/bundle/v1Release/app-v1-release.aab

      - name: Upload v2.0 Release App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-v2-release-aab
          path: app/build/outputs/bundle/v2Release/app-v2-release.aab

      - name: Create Automated GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: "release-${{ github.sha }}"
          name: "Load Tracker Pro Release (${{ github.ref_name }})"
          body: |
            ## 🚀 Load Tracker Pro Automated Release

            ### 📦 Attached Production App Bundles:
            - **v1.x Release Bundle (`com.loadtracker.pro`):** `app-v1-release.aab`
            - **v2.0 Release Bundle (`com.loadtracker.pro.v2`):** `app-v2-release.aab`

            *Automated build verified by 14 unit test suites.*
          files: |
            app/build/outputs/bundle/v1Release/app-v1-release.aab
            app/build/outputs/bundle/v2Release/app-v2-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
